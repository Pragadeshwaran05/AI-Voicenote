<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI VoiceNote | Intelligent Text-to-Speech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-microphone-alt"></i>
                    <span>AI VoiceNote</span>
                </div>
                <button class="close-sidebar d-mobile" id="closeSidebar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li class="{% if request.path == '/' or request.path == '/dashboard' %}active{% endif %}">
                        <a href="/dashboard"><i class="fas fa-home"></i> Create Voice</a>
                    </li>
                    <li class="{% if request.path == '/documents' %}active{% endif %}">
                        <a href="/documents"><i class="fas fa-file-alt"></i> Documents</a>
                    </li>
                    <li class="{% if request.path == '/library' %}active{% endif %}">
                        <a href="/library"><i class="fas fa-bookmark"></i> Favorites</a>
                    </li>
                    <li class="{% if request.path == '/history' %}active{% endif %}">
                        <a href="/history"><i class="fas fa-history"></i> History</a>
                    </li>
                    <li class="{% if request.path == '/settings' %}active{% endif %}">
                        <a href="/settings"><i class="fas fa-cog"></i> Settings</a>
                    </li>
                    <li class="{% if request.path == '/help' %}active{% endif %}">
                        <a href="/help"><i class="fas fa-question-circle"></i> Help & About</a>
                    </li>
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <div class="version-badge">v1.0.0 - Phase 1</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="open-sidebar d-mobile" id="openSidebar">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                </div>
                
                <div class="header-right">
                    <div class="status-indicator">
                        <span class="pulse"></span> System Online
                    </div>
                    <button class="icon-btn" title="Coming in Phase 2"><i class="fas fa-bell"></i></button>
                    <div class="user-profile">
                        <div class="avatar"><i class="fas fa-user"></i></div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
